<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565C0">
  <title>Asistente de Producción</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barra de arriba -->
  <header class="barra">
    <h1>Asistente de Producción</h1>
    <button id="btnAjustes" class="icono" aria-label="Ajustes" title="Ajustes">⚙️</button>
  </header>

  <!-- Conversación -->
  <main id="chat" class="chat" aria-live="polite"></main>

  <!-- Preguntas frecuentes -->
  <section id="frecuentes" class="frecuentes" aria-label="Preguntas frecuentes"></section>

  <!-- Caja para escribir y micrófono -->
  <form id="formulario" class="entrada" autocomplete="off">
    <input id="texto" type="text" placeholder="Escribe o toca el micrófono…" aria-label="Pregunta">
    <button id="btnEnviar" type="submit" class="enviar" aria-label="Enviar">➤</button>
    <button id="btnMic" type="button" class="mic" aria-label="Hablar">🎤</button>
  </form>

  <!-- Ajustes -->
  <dialog id="dlgAjustes" class="dialogo">
    <form method="dialog" id="formAjustes">
      <h2>Ajustes</h2>
      <label>URL de la aplicación web (termina en /exec)
        <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>
      </label>
      <label>PIN (déjalo vacío mientras estamos en prueba)
        <input id="cfgPin" type="password" inputmode="numeric">
      </label>
      <label class="fila"><input id="cfgVoz" type="checkbox" checked> Leer las respuestas en voz alta</label>
      <label>Velocidad de la voz
        <input id="cfgVelocidad" type="range" min="0.7" max="1.5" step="0.05" value="1.05">
      </label>
      <label class="fila"><input id="cfgAuto" type="checkbox" checked> Enviar apenas termine de hablar</label>
      <p id="estadoConexion" class="nota"></p>
      <div class="botones">
        <button type="button" id="btnProbar" class="secundario">Probar conexión</button>
        <button type="submit" value="guardar" class="primario">Guardar</button>
      </div>
      <p class="nota">La URL y el PIN se guardan solo en este celular o computador.</p>
    </form>
  </dialog>

  <!-- PIN de edición para confirmar cambios -->
  <dialog id="dlgEdicion" class="dialogo">
    <form method="dialog" id="formEdicion">
      <h2>Confirmar cambio</h2>
      <p id="txtCambio"></p>
      <label>PIN de edición
        <input id="pinEdicion" type="password" inputmode="numeric" autocomplete="off">
      </label>
      <label class="fila"><input id="recordarEdicion" type="checkbox"> Recordar hasta cerrar la página</label>
      <div class="botones">
        <button type="submit" value="cancelar" class="secundario">Cancelar</button>
        <button type="submit" value="ok" class="primario">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
